[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroviral"
version = "0.1.0"
description = "Fully-local, research-informed social-media video virality predictor (brain-response simulation/proxy)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NeuroViral" }]
keywords = ["virality", "tiktok", "reels", "neuroforecasting", "video", "local-ml"]

# Core dependencies. The heavy ML models load lazily on first real use, and
# every extractor degrades gracefully if its optional dependency is missing,
# so the unit test-suite runs without downloading multi-GB weights.
dependencies = [
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
# The full local-ML stack. `pip install -e ".[ml]"` pulls the real extractors.
ml = [
    "librosa>=0.10,<1",
    "faster-whisper>=1.0,<2",
    "scenedetect>=0.6,<0.7",
    # opencv-contrib-python (not opencv-python) so there is exactly ONE OpenCV
    # package: mediapipe requires opencv-contrib-python, and installing both
    # opencv variants ships duplicate native libs (libavdevice) that collide
    # with PyAV and cause intermittent extractor crashes on macOS.
    "opencv-contrib-python>=4.8",
    "mediapipe>=0.10,<0.11",
    "sentence-transformers>=2.2,<4",
    "ffmpeg-python>=0.2,<0.3",
    "soundfile>=0.12",
]
# Web dashboard.
web = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
# Calibration (re-fit weights from labeled post analytics).
calibrate = [
    "scikit-learn>=1.3,<2",
]
# Everything.
all = [
    "neuroviral[ml,web,calibrate]",
]
dev = [
    "pytest>=7.4",
    "neuroviral[web,calibrate]",
]

[project.scripts]
neuroviral = "neuroviral.cli:main"

[tool.setuptools.packages.find]
include = ["neuroviral*", "dashboard*"]

[tool.setuptools.package-data]
dashboard = ["static/*"]
neuroviral = ["extractors/data/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
